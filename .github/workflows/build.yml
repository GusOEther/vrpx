name: build-and-deploy

on:
  schedule:
    - cron: "30 23 * * 1-5"   # weekdays 23:30 UTC — after US close & index settlement
  workflow_dispatch:           # manual runs from the Actions tab
  push:
    branches: [main]           # every push redeploys with fresh data

permissions:
  contents: write          # commit the forward-test log back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build report (with retries — Yahoo sometimes throttles CI IPs)
        run: |
          for i in 1 2 3; do
            if python vrpx.py; then exit 0; fi
            if [ "$i" -lt 3 ]; then echo "attempt $i failed — retrying in 180s"; sleep 180; fi
          done
          echo "all attempts failed — previous deployment stays live"
          exit 1

      - name: Commit forward-test log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecast_forward.csv
          if ! git diff --staged --quiet; then
            git commit -m "forward-test: log/resolve $(date -u +%F) [skip ci]"
            git push
          else
            echo "no forward-test change"
          fi

      - name: Stage site
        run: mkdir -p dist && cp vrpx_report.html dist/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
